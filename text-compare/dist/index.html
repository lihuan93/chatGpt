<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="在浏览器中快速对比两段文本，清晰查看新增与删除内容。"><title>DiffNote · 文本对比</title><link rel="stylesheet" href="style.css"></head><body>
<header><a class="brand" href="./"><span class="logo">≠</span> DiffNote <span class="tag">文本对比</span></a><span class="privacy"><i></i> 文本仅在本地处理</span></header>
<main><section class="workspace"><div class="tools"><div class="tools-left"><label class="language-label" for="language">语言</label><select id="language" aria-label="选择文本语言"><option value="java">Java</option><option value="json" selected>JSON</option><option value="xml">XML</option><option disabled>──────────</option><option value="plaintext">纯文本</option><option value="javascript">JavaScript</option><option value="typescript">TypeScript</option><option value="python">Python</option><option value="xml-html">HTML</option><option value="css">CSS</option><option value="sql">SQL</option><option value="bash">Bash / Shell</option><option value="c">C</option><option value="cpp">C++</option><option value="csharp">C#</option><option value="go">Go</option><option value="yaml">YAML</option><option value="markdown">Markdown</option></select></div><div class="actions"><button id="example">载入示例</button><button id="swap" aria-label="交换左右文本">⇄ 交换</button><button id="clear">清空</button></div></div>
<div class="editors"><section class="editor"><div class="editor-title"><label for="left"><span class="dot old"></span>原始文本</label><div class="code-actions"><button data-fold="left" aria-label="折叠原始文本的代码块">折叠代码</button><button data-unfold="left" aria-label="展开原始文本的代码块">展开代码</button></div></div><div id="leftBody"><div id="leftEditor" class="source-code"></div><textarea hidden aria-label="原始文本" id="left" spellcheck="false" placeholder="在这里粘贴原始JSON代码…" maxlength="20000"></textarea><div class="editor-foot"><span id="leftCount">0 字符 · 0 行</span><span>最多 20,000 字符</span></div></div></section><section class="editor"><div class="editor-title"><label for="right"><span class="dot new"></span>修改后文本</label><div class="code-actions"><button data-fold="right" aria-label="折叠修改后文本的代码块">折叠代码</button><button data-unfold="right" aria-label="展开修改后文本的代码块">展开代码</button></div></div><div id="rightBody"><div id="rightEditor" class="source-code"></div><textarea hidden aria-label="修改后文本" id="right" spellcheck="false" placeholder="在这里粘贴修改后JSON代码…" maxlength="20000"></textarea><div class="editor-foot"><span id="rightCount">0 字符 · 0 行</span><span>最多 20,000 字符</span></div></div></section></div>
<div class="comparebar"><div class="options"><label><input type="checkbox" id="spaces">忽略空白</label><label><input type="checkbox" id="case">忽略大小写</label></div><button class="primary" id="compare">开始对比 <span>↗</span></button></div></section>
<section class="result-section" id="resultSection"><div class="result-heading"><div><h2>对比结果</h2><span id="status" class="status">等待对比</span><span class="fold-hint">点击行号旁箭头折叠代码块</span></div><div class="result-actions"><button id="copy" disabled>复制差异报告</button><div class="code-actions"><button data-fold="result">折叠代码</button><button data-unfold="result">展开代码</button></div></div></div><div class="result-body" id="resultBody"><div id="summary" hidden></div><div id="result" class="result empty" aria-live="polite"><div class="empty-icon">≠</div><h3>让变化浮现</h3><p>输入左右两段文本，点击「开始对比」查看差异</p><div class="legend"><span><i class="add-square"></i>新增内容</span><span><i class="del-square"></i>删除内容</span></div></div></div></section>
</main><div id="toast" role="status"></div><script src="vendor/code-editor.js"></script><script src="diff.js"></script><script src="app.js"></script></body></html>
